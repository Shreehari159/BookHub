<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            background: #e3f2fd;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chatbot {
            position: relative;
            width: 420px;
            overflow: hidden;
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 0 128px 0 rgba(0, 0, 0, 0.1),
                        0 32px 64px -48px rgba(0, 0, 0, 0.5);
        }

        .chatbot header {
            background: #724ae8;
            padding: 16px 0;
            text-align: center;
        }

        .chatbot header h2 {
            color: #fff;
            font-size: 1.4rem;
        }

        .chatbox {
            height: 510px;
            overflow-y: auto;
            padding: 15px 20px 70px;
        }

        .chatbox .chat {
            display: flex;
            margin: 10px 0;
        }

        .chatbox .chat-incoming span {
            height: 32px;
            width: 32px;
            color: #fff;
            background: #724ae8;
            text-align: center;
            line-height: 32px;
            border-radius: 50%;
            margin: 0 10px 0 0;
        }

        .chatbox .chat-outgoing {
            justify-content: flex-end;
            display: flex;
        }

        .chatbox .chat p {
            font-size: 0.95rem;
            padding: 12px 16px;
            border-radius: 10px 10px 0 10px;
        }

        .chatbox .chat-incoming p {
            background: #f2f2f2;
            color: #000;
            border-radius: 10px 10px 10px 0;
        }

        .chatbox .chat-outgoing p {
            background: #724ae8;
            color: #fff;
        }

        .chat-input {
            position: absolute;
            bottom: 0;
            width: 100%;
            display: flex;
            align-items: center;
            padding: 10px 20px;
            border-top: 1px solid #ddd;
        }

        .chat-input textarea {
            flex: 1;
            height: 40px;
            border: none;
            padding: 8px;
            border-radius: 20px;
            outline: none;
            resize: none;
            font-size: 1rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .chat-input span {
            margin-left: 10px;
            color: #724ae8;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="chatbot">
        <header>
            <h2>Chatbot</h2>
        </header>
        <ul class="chatbox" id="chatbox">
            <li class="chat chat-incoming">
                <span class="material-symbols-outlined">smart_toy</span>
                <p>Hi there! <br> How can I help you today?</p>
            </li>
        </ul>
        <div class="chat-input">
            <textarea id="userInput" placeholder="Enter a message..."></textarea>
            <span id="send-btn" class="material-symbols-outlined">send</span>
        </div>
    </div>

    
    <script src="script.js"></script>
</body>
</html>
